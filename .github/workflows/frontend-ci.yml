# Purpose: GitHub Actions workflow for frontend CI (linting and testing).
# TODO: Define jobs for linting and running unit/integration tests for the frontend on push/pull_request to develop and main.

name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Specify your project's Node.js version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci # or yarn install

      - name: Run Linter
        run: npm run lint # TODO: Ensure you have a lint script in frontend/package.json

  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Specify your project's Node.js version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci # or yarn install

      - name: Run Tests
        run: npm test # TODO: Ensure you have a test script in frontend/package.json

