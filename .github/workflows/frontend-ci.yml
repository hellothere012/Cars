# .github/workflows/frontend-ci.yml
name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  lint-test-build:
    name: Lint, Test, and Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 # Updated to v4
        with:
          node-version: '18' # Or your project's Node.js version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        # TODO: If using a different package manager (e.g., yarn), change command:
        # run: yarn install --frozen-lockfile

      - name: Run linters
        run: npm run lint
        # TODO: Ensure 'lint' script is defined and configured in frontend/package.json

      - name: Run tests
        run: npm run test -- --watchAll=false # Example for Jest to run in non-watch mode
        # TODO: Ensure 'test' script is defined in frontend/package.json
        # TODO: Configure any necessary test environment variables (e.g., mock API URL for unit/integration tests)

      # Optional: Build application to catch build errors early
      # This step is implicitly covered by Amplify deployment, but can be useful here.
      # - name: Build application
      #   run: npm run build
      #   # TODO: Ensure 'build' script is defined in frontend/package.json

    # TODO:
    # - Add vulnerability scanning (e.g., npm audit, Snyk).
    # - Add code coverage reporting (e.g., upload to Codecov).
    # - Consider matrix testing for different Node.js versions or browsers if applicable.
