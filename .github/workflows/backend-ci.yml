# .github/workflows/backend-ci.yml
name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-test-synth:
    name: Lint, Test Backend and Synth CDK
    runs-on: ubuntu-latest
    # TODO: Configure AWS credentials for CDK synth if it needs to resolve context from your AWS account.
    #       It's best practice for synth to not require live AWS calls if possible.
    # permissions:
    #   id-token: write # For OIDC if used
    #   contents: read
    env:
      # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_FOR_SYNTH }} # Example
      # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_FOR_SYNTH }} # Example
      AWS_DEFAULT_REGION: 'us-east-1' # Specify your target AWS region
      NODE_OPTIONS: '--max-old-space-size=4096' # Increase memory for Node if needed for CDK synth

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 # Updated to v4
        with:
          node-version: '18' # Or your project's Node.js version
          cache: 'npm'
          # TODO: Refine cache-dependency-path if multiple package-lock.json files are used across backend/ and infra/
          cache-dependency-path: |
            infra/cdk/package-lock.json
            backend/lambdas/createVehicle/package-lock.json
            backend/lambdas/getVehicle/package-lock.json
            backend/lambdas/searchVehicles/package-lock.json
            backend/lambdas/updateVehicle/package-lock.json
            backend/lambdas/deleteVehicle/package-lock.json
            backend/lambdas/calculateKBB/package-lock.json
            backend/lambdas/booksheetOCR/package-lock.json


      - name: Install CDK project dependencies
        run: cd infra/cdk && npm ci
      # TODO: Add lint and test execution for CDK code (e.g., npm run lint --prefix infra/cdk)

      - name: Install Lambda dependencies
        run: |
          echo "Installing dependencies for Lambdas..."
          for dir in backend/lambdas/*/; do
            if [ -f "${dir}package.json" ]; then
              echo "Installing dependencies for ${dir}"
              (cd "${dir}" && npm ci)
            fi
          done
      # TODO: Add lint and test execution for Lambda functions (e.g., loop through dirs and run npm run lint/test)


      - name: CDK Synth
        env:
          # Determine environment for CDK context based on GitHub branch
          CDK_ENV_NAME: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        run: |
          cd infra/cdk
          npm install -g aws-cdk # Ensure CDK CLI is available
          echo "Synthesizing CDK for environment: $CDK_ENV_NAME"
          # Note: The githubConnectionArn placeholder needs to be a valid ARN format, even if it's a dummy one for synth,
          # or CiCdPipelineStack might fail on synth if it expects a specific ARN format.
          # Using a generic valid-looking ARN placeholder if no context variable is provided.
          # Best practice: Provide these via GitHub secrets if the synth needs to resolve them for some reason,
          # or make the CiCdPipelineStack instantiation conditional if it's not meant to be synthed here.
          CONNECTION_ARN_PLACEHOLDER="arn:aws:codestar-connections:us-east-1:123456789012:connection/00000000-0000-0000-0000-000000000000"
          cdk synth -a "npx ts-node --prefer-ts-exts bin/app.ts" \
            -c env=$CDK_ENV_NAME \
            -c projectPrefix=CarInv \
            -c githubOwner=${{ github.repository_owner }} \
            -c githubRepo=${{ github.event.repository.name }} \
            -c githubConnectionArn=${{ secrets.GH_CONNECTION_ARN_FOR_SYNTH || env.GH_CONNECTION_ARN_FOR_SYNTH_CONTEXT || CONNECTION_ARN_PLACEHOLDER }} \
            --quiet
        # TODO:
        # - Replace YOUR_REGION, YOUR_ACCOUNT_ID, YOUR_CONNECTION_ID_PLACEHOLDER logic for githubConnectionArn.
        #   Ideally, for a pure synth check not deploying CiCdPipelineStack itself, you might make its instantiation
        #   conditional in app.ts or provide dummy values if it only needs them for synth and doesn't validate the ARN's existence.
        #   Using secrets.GH_CONNECTION_ARN_FOR_SYNTH (if set) or a context variable GH_CONNECTION_ARN_FOR_SYNTH_CONTEXT
        #   (if set via -c in a manual trigger) or a hardcoded valid ARN format placeholder.

    # TODO:
    # - Add vulnerability scanning for backend dependencies.
    # - Consider deploying synthesized templates to a test S3 bucket (as artifacts).
    # - Integrate with SonarQube or other static analysis tools.
